name: global-greeting-platform
services:
  greeting-api:
    build: .
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      GREETING_REGION: global
      GREETING_RELIABILITY_TIER: platinum
    depends_on:
      greeting-db: { condition: service_healthy }
      greeting-cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
  greeting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greetings
      POSTGRES_USER: greeting_operator
      POSTGRES_PASSWORD: highly-classified-local-development-password
    volumes: ["greeting-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greeting_operator -d greetings"]
      interval: 5s
      timeout: 3s
      retries: 5
  greeting-cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: greeting-admin
      GF_SECURITY_ADMIN_PASSWORD: greeting-admin
    depends_on: [prometheus]
volumes:
  greeting-data:
