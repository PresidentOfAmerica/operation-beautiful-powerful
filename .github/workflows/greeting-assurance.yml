name: Greeting Assurance Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  canonical-greeting-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audited production dependencies
        run: npm ci --ignore-scripts
      - name: Validate canonical greeting delivery
        run: npm test
